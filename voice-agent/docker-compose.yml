services:
  voice-agent:
    build: .
    container_name: voice-agent
    environment:
      # Vault tourne directement sur le PC hôte (hors Docker) à http://localhost:8300 —
      # depuis un conteneur, on l'atteint via host.docker.internal.
      VAULT_ADDR: http://host.docker.internal:8300
      VAULT_TOKEN: ${VAULT_TOKEN}
      # Langues declarees de l agent (codes ISO) et langue par defaut :
      # fr=francais, en=anglais, wo=wolof, ff=pular.
      AGENT_LANGUAGES: ${AGENT_LANGUAGES:-fr,en,wo,ff}
      AGENT_DEFAULT_LANGUAGE: ${AGENT_DEFAULT_LANGUAGE:-fr}
      # PIPELINE_MODE=cascade (STT-LLM-TTS, modulaire) ou realtime (speech-to-speech, fluide).
      PIPELINE_MODE: ${PIPELINE_MODE:-cascade}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-5-20250929}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      PIPER_VOICE: ${PIPER_VOICE:-fr_FR-siwis-medium}
      # STT_PROVIDER=gemini (en ligne, precis et rapide) ou whisper (local, hors ligne).
      STT_PROVIDER: ${STT_PROVIDER:-gemini}
      # TTS_PROVIDER=gemini (multilingue, wolof compris) ou piper (local, francais, sans quota).
      TTS_PROVIDER: ${TTS_PROVIDER:-gemini}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # Mettre à 1 le temps d'un appel pour vider l'audio entrant brut dans /app/dump.
      DEBUG_DUMP_AUDIO: ${DEBUG_DUMP_AUDIO:-}
      PIPECAT_WS_HOST: 0.0.0.0
      PIPECAT_WS_PORT: 8765
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Doit rester joignable uniquement via l'interface WireGuard (10.10.0.2), pas
      # exposé publiquement — voir RUNBOOK.md pour le rappel sécurité.
      - "8765:8765"
